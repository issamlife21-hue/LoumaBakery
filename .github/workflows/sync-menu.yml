name: Sync menu from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # daily, 6am Pacific

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ vars.SHEET_CSV_URL }}" ]; then
            echo "SHEET_CSV_URL repo variable is not set yet. Sync not configured; exiting cleanly."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Install deps
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      - name: Sync
        if: steps.cfg.outputs.configured == 'true'
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: node scripts/sync-menu.mjs

      - name: Commit if changed
        if: steps.cfg.outputs.configured == 'true'
        run: |
          if git diff --quiet -- src/data/menu.json; then
            echo "Menu unchanged; nothing to commit."
          else
            git config user.name "menu-sync-bot"
            git config user.email "actions@github.com"
            git add src/data/menu.json
            git commit -m "menu: sync from sheet"
            git push
          fi
